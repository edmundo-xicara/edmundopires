<style>
/* Layout: the Lab as tabs, one per project. Each tab is a pinned walkthrough: the steps on the left,
   a screen on the right that swaps its content as you scroll, without the page moving down. Violeta tokens. */
:root {
  --bg: #F3F1F8; --surface: #FFFFFF; --ink: #1A1030; --muted: #625A78;
  --accent: #6A2BFF; --on-accent: #FFFFFF; --marker: #FFD23F; --line: #DCD8E3; --soft: #E9E3F8;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --type: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --brush: "Kaushan Script", "Segoe Script", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--body); overflow-x: hidden; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -.025em; line-height: 1; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font: 500 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 99px; padding: 10px 16px; font-weight: 600; font-size: 14px; background: var(--accent); color: #fff; border: 0; cursor: pointer; transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.btn:hover { transform: scale(1.04); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }

/* header + logo, as on the home */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 85%, transparent); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
nav.links { display: flex; gap: 30px; font-size: 15px; font-weight: 500; }
nav.links a { color: var(--muted); position: relative; padding-block: 6px; }
nav.links a.on { color: var(--ink); }
nav.links a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; border-radius: 3px; background: var(--accent); }
@media (max-width: 760px) { nav.links { display: none; } }
.bm { display: inline-flex; align-items: baseline; font-size: 24px; line-height: 1; white-space: nowrap; }
.bm .pr { font: 600 .9em/1 var(--type); color: var(--accent); margin-right: .28em; opacity: .75; }
.bm .tt { font: 600 .9em/1 var(--type); letter-spacing: .01em; }
.bm .cur { display: inline-block; width: .09em; height: .95em; margin: 0 .1em 0 .06em; background: var(--accent); align-self: center; animation: blink 1.05s steps(2) infinite; }
.bm .paint { margin-left: .1em; font: 400 1.3em/1 var(--brush); color: var(--accent); filter: url(#ink-sm); }
@keyframes blink { 50% { opacity: 0; } }

/* title */
.hero { padding-block: clamp(44px, 6vw, 84px) clamp(24px, 3vw, 36px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: end; }
.hero h1 { font-size: clamp(80px, 15vw, 220px); font-variation-settings: "wdth" 76; letter-spacing: -.05em; line-height: .84; }
.hero h1 .cur { display: inline-block; width: .08em; height: .72em; margin-left: .06em; background: var(--accent); animation: blink 1.05s steps(2) infinite; vertical-align: baseline; }
.hero p { max-width: 26em; color: var(--muted); font-size: clamp(16px, 1.5vw, 19px); }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }

/* tabs */
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 25; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 8px; padding-block: 10px; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; transition: background .3s, color .3s, border-color .3s; }
.tab small { font: 500 11px var(--mono); color: var(--muted); }
.tab .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); font: 600 11px var(--mono); }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab[aria-selected="true"] small { color: rgba(255,255,255,.6); }
.tab[aria-selected="true"] .dot { background: var(--accent); color: #fff; }
.tab .live { width: 7px; height: 7px; border-radius: 50%; background: #1FAF5A; }

/* a project: its intro, then the pinned walkthrough */
.panel-wrap { transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1); }
.panel-wrap.leaving { opacity: 0; transform: translateY(16px); }
.proj { padding-block: clamp(36px, 5vw, 64px) 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 40px; align-items: end; }
.proj h2 { font-size: clamp(36px, 5vw, 72px); font-variation-settings: "wdth" 84; }
.proj .meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
.chip { font: 500 12px var(--mono); padding: 5px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip.ok { background: rgba(31,175,90,.1); border-color: transparent; color: #137a3e; }
.proj .acts { display: flex; flex-wrap: wrap; gap: 10px; }
@media (max-width: 760px) { .proj { grid-template-columns: minmax(0, 1fr); } }

.walk { position: relative; }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 122px); height: calc(100svh - 122px); display: flex; align-items: center; }
.stage .grid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: clamp(24px, 5vw, 72px); align-items: center; width: 100%; }
.steps { display: grid; gap: 4px; }
.step { padding: 12px 0 12px 20px; border-left: 2px solid var(--line); opacity: .38; transition: opacity .4s, border-color .4s; cursor: pointer; }
.step.on { opacity: 1; border-color: var(--accent); }
.step .k { font: 500 12px/1 var(--mono); color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.step h3 { font-size: clamp(20px, 2.2vw, 30px); margin-top: 8px; font-variation-settings: "wdth" 90; }
.step p { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.6; max-height: 0; overflow: hidden; transition: max-height .5s; }
.step.on p { max-height: 160px; }
.screen { position: relative; aspect-ratio: 16 / 11; max-width: 100%; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 50px 80px -46px rgba(26,16,48,.55); }
.screen .bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.screen .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.screen .bar span { margin-left: 10px; font: 500 12px var(--mono); color: var(--muted); }
.pane { position: absolute; inset: 38px 0 0; opacity: 0; transform: translateY(20px) scale(.98); transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.pane.on { opacity: 1; transform: none; }
.pane.pad { padding: clamp(16px, 2.6vw, 28px); display: grid; align-content: start; gap: 12px; }
.pane img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); z-index: 2; }
.count { position: absolute; right: 14px; bottom: 12px; z-index: 2; font: 500 12px var(--mono); background: var(--ink); color: #fff; padding: 4px 9px; border-radius: 99px; }
@media (max-width: 900px) {
  .stage .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .step:not(.on) { display: none; }
  .step { padding-block: 2px; }
  .screen { aspect-ratio: 4 / 3.3; }
}

/* pane fragments */
.sheet { font: 400 12px/1 var(--mono); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sheet table { width: 100%; border-collapse: collapse; }
.sheet th, .sheet td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.sheet th { background: var(--soft); color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.sheet tr:last-child td { border-bottom: 0; }
.sheet .tag { display: inline-block; padding: 2px 7px; border-radius: 99px; background: rgba(31,175,90,.12); color: #137a3e; }
.note { font: 600 22px/1.1 "Caveat", cursive; color: var(--accent); }
.term { background: var(--ink); color: #E9E3F8; border-radius: 12px; padding: 16px 18px; font: 400 13px/1.8 var(--type); white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: var(--marker); } .term .c { color: rgba(233,227,248,.5); } .term .ok { color: #6BE39A; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stats b { display: block; font: 800 clamp(24px, 2.6vw, 34px)/1 var(--display); font-variation-settings: "wdth" 76; }
.stats span { font-size: 12px; color: var(--muted); }
.old { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; position: relative; }
.old .t { font: 700 26px/1.05 var(--body); color: #3b3b3b; }
.old .b { display: flex; gap: 8px; } .old .b i { width: 90px; height: 28px; border-radius: 6px; background: #d9d9d9; }
.old svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.old path { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.refs { display: grid; gap: 7px; }
.refs div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
.refs b { font: 500 12px var(--mono); color: var(--accent); }
.swatches { display: flex; gap: 8px; } .swatches i { flex: 1; height: 56px; border-radius: 12px; border: 1px solid var(--line); }
.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; height: 100%; }
.minis img { border-radius: 10px; border: 1px solid var(--line); height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; }

footer { border-top: 1px solid var(--line); padding-block: 26px; font-size: 14px; color: var(--muted); margin-top: 60px; }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<span style="color:#C9B3FF">export default function</span> Home() {
  <span style="color:#C9B3FF">return</span> &lt;Hero /&gt;;
}</div><div class="stack"><span class="chip">React</span><span class="chip">TypeScript</span><span class="chip">GSAP</span><span class="chip">Lenis</span><span class="chip">Tailwind</span><span class="chip">Claude Code</span></div></div>` },
      ],
    },
  ];

  // ── tabs
  const tabsEl = document.getElementById("tabs"), panel = document.getElementById("panel");
  tabsEl.innerHTML = PROJECTS.map((p, i) => `<button class="tab" role="tab" type="button" id="tab-${p.id}" aria-controls="panel" aria-selected="${i === 0}"><span class="dot">${String(i + 1).padStart(2, "0")}</span>${p.name}<span class="live" title="No ar"></span></button>`).join("");
  const tabs = [...tabsEl.children];
  let current = -1, cleanup = () => {};

  function render(i) {
    const p = PROJECTS[i];
    panel.setAttribute("aria-labelledby", `tab-${p.id}`);
    panel.innerHTML = `
      <section class="wrap proj">
        <div>
          <span class="mono" style="color:var(--accent)">Projeto ${String(i + 1).padStart(2, "0")} · ${p.year}</span>
          <h2 style="margin-top:10px">${p.title}</h2>
          <div class="meta"><span class="chip ok">● No ar</span>${p.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
        </div>
        <div class="acts">${p.links.map(([t, h], k) => `<a class="btn${k ? " ghost" : ""}" href="${h}" target="_blank" rel="noopener noreferrer">${t}</a>`).join("")}</div>
      </section>
      <div class="walk" id="walk" style="height:calc(${p.steps.length} * 70svh + 100svh - ${OFFSET}px)">
        <div class="stage">
          <div class="wrap grid">
            <div class="steps">${p.steps.map((s, k) => `<div class="step${k ? "" : " on"}" data-k="${k}"><div class="k">${s.k}</div><h3>${s.h}</h3><p>${s.p}</p></div>`).join("")}</div>
            <div class="screen">
              <div class="bar"><i></i><i></i><i></i><span id="file">${p.steps[0].file}</span></div>
              ${p.steps.map(s => s.pane).join("")}
              <span class="count" id="count">01 / ${String(p.steps.length).padStart(2, "0")}</span>
              <div class="prog" id="prog"></div>
            </div>
          </div>
        </div>
      </div>`;
    const walk = document.getElementById("walk");
    const steps = [...walk.querySelectorAll(".step")], panes = [...walk.querySelectorAll(".pane")];
    panes[0].classList.add("on");
    let active = 0;
    const onScroll = () => {
      const r = walk.getBoundingClientRect(), span = Math.max(1, r.height - (vh() - OFFSET));
      const pr = Math.min(1, Math.max(0, -r.top / span));
      document.getElementById("prog").style.width = pr * 100 + "%";
      const idx = Math.min(steps.length - 1, Math.floor(pr * steps.length));
      if (idx === active) return;
      active = idx;
      steps.forEach((s, k) => s.classList.toggle("on", k === idx));
      panes.forEach((s, k) => s.classList.toggle("on", k === idx));
      document.getElementById("file").textContent = p.steps[idx].file;
      document.getElementById("count").textContent = `${String(idx + 1).padStart(2, "0")} / ${String(steps.length).padStart(2, "0")}`;
    };
    // clicking a step scrolls to it
    steps.forEach((s, k) => s.addEventListener("click", () => {
      const span = walk.offsetHeight - (vh() - OFFSET);
      scrollTo({ top: walk.getBoundingClientRect().top + scrollY + ((k + .5) / steps.length) * span, behavior: reduce ? "auto" : "smooth" });
    }));
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => removeEventListener("scroll", onScroll);
  }

  function select(i, scroll = true) {
    if (i === current) return;
    tabs.forEach((t, k) => t.setAttribute("aria-selected", String(k === i)));
    const first = current < 0;
    current = i;
    const swap = () => {
      cleanup();
      cleanup = render(i);
      panel.classList.remove("leaving");
      // every tab starts at its own beginning
      if (scroll && !first) {
        const top = panel.getBoundingClientRect().top + scrollY - OFFSET;
        if (scrollY > top) scrollTo({ top, behavior: "auto" });
      }
    };
    if (first || reduce) return swap();
    panel.classList.add("leaving");
    setTimeout(swap, 300);
  }
  tabs.forEach((t, i) => t.addEventListener("click", () => select(i)));
  tabsEl.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const n = (current + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    tabs[n].focus(); select(n);
  });
  select(0, false);
})();
</script>
